name: Test
on: [pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-latest
          - os: ubuntu-latest
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - uses: marler8997/setup-anyzig@master
      - run: |
          zig build install test --summary all
